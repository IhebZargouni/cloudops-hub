name: CloudOps Hub CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_${{ github.sha }}
          MYSQL_DATABASE: test_${{ github.sha }}
          MYSQL_USER: user_${{ github.sha }}
          MYSQL_PASSWORD: pass_${{ github.sha }}
        ports:
          - 3306:3306
        options: 
                 --health-cmd="mysqladmin ping"
                 --health-interval=10s
                 --health-timeout=5s
                 --health-retries=3

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: mysql://user_${{ github.sha }}:pass_${{ github.sha }}@localhost:3306/test_${{ github.sha }}

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: mysql://user_${{ github.sha }}:pass_${{ github.sha }}@localhost:3306/test_${{ github.sha }}

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: mysql://user_${{ github.sha }}:pass_${{ github.sha }}@localhost:3306/test_${{ github.sha }}